<div class="hero-section">
  <div class="hero-image">
    <img src="../../assets/images/heroImage.png" alt="Imagem de Hero" />
  </div>
  <div class="hero-content">
    <h1 class="hero-title">{{ "HERO.TITLE" | translate }}</h1>
    <p class="hero-description">
      {{ "HERO.DESCRIPTION" | translate }}
    </p>
    <button mat-flat-button color="#6da67a" (click)="this.redirect()">
      {{ "HERO.BUTTONTEXT" | translate }}
    </button>
  </div>
</div>
