<div class="container">
  <mat-card class="login-card">
    <h2>{{ "LOGINPAGE.TITLE" | translate }}</h2>
    <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
      <mat-form-field appearance="outline" floatLabel="always">
        <mat-label>{{ "LOGINPAGE.EMAIL" | translate }}</mat-label>
        <input matInput formControlName="email" />
      </mat-form-field>

      <mat-form-field appearance="outline" floatLabel="always">
        <mat-label>{{ "LOGINPAGE.SENHA" | translate }}</mat-label>
        <input matInput type="password" formControlName="password" />
      </mat-form-field>

      <button
        mat-flat-button
        color="primary"
        type="submit"
        [disabled]="!loginForm.valid"
      >
      {{ "LOGINPAGE.BUTTONTEXT" | translate }}
      </button>

      <p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p>
    </form>

    <a (click)="goToRegister()" class="register-link">
      {{ "LOGINPAGE.BUTTONREGISTERTEXT" | translate }}
    </a>
  </mat-card>
</div>
